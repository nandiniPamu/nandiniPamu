<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report - SafeSpace</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Report an Incident</h1>
            <p>Please provide details about the incident. Your safety is our priority.</p>
        </header>
        <main>
            <form action="{{ url_for('submit_report') }}" method="post" enctype="multipart/form-data">
                <label for="details">Incident Details:</label>
                <textarea name="details" id="details" rows="8" placeholder="Describe what happened..." required></textarea>

                <label for="screenshot">Upload a screenshot (optional):</label>
                <input type="file" id="screenshot" name="screenshot">

                <div style="text-align: center; margin-top: 1rem;">
                    <button type="submit" class="btn btn-secondary">Submit Report</button>
                    <a href="{{ url_for('index') }}" class="btn" style="color: #666;">Cancel</a>
                </div>
            </form>
        </main>
    </div>
</body>
</html>
