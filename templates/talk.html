<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I want to talk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>I want to talk</h1>
        <p>Paste a message or conversation below to get an instant analysis.</p>
        <form action="/analyze" method="post">
            <textarea name="message" rows="10" cols="50" placeholder="Enter your message here..."></textarea>
            <br>
            <button type="submit" class="btn">Analyze</button>
        </form>
    </div>
</body>
</html>
